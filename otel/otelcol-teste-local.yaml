# Config de ENSAIO - nao envia nada para o Dynatrace.
#
# Mesmo receiver, processors e exporter (otlphttp) da config de producao, mas
# apontando para um endpoint local no lugar do Dynatrace. Serve para validar a
# cadeia gerador -> UDP -> ams2_collector.py -> OTLP -> collector sem precisar
# de token nem consumir ingestao.
#
#   python3 otel/endpoint_falso.py                 # terminal 1, porta 4319
#   ./dynatrace-otel-collector --config otel/otelcol-teste-local.yaml   # terminal 2
#
# A distribuicao Dynatrace do collector nao traz o exporter `file`; os
# exporters disponiveis sao kafka, debug, otlp, otlphttp e loadbalancing.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 200
    send_batch_max_size: 500
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  otlp_http/local:
    endpoint: http://127.0.0.1:4319
    # JSON em vez do protobuf padrao para o endpoint falso conseguir ler e
    # imprimir os campos. A config de producao usa o padrao (protobuf).
    encoding: json
    compression: none
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/local]
  telemetry:
    logs:
      level: info
